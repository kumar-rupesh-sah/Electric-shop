<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ग्रामकार्ट - डिजिटल इलेक्ट्रिक स्टोर</title>
    <style>
        /* (CSS waisa hi rakha hai jaisa aapne diya tha) */
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; }
        header { background-color: #1a5276; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #ddd; padding: 12px; border-radius: 8px; background: #fff; display: flex; align-items: center; gap: 15px; }
        .product-card img { width: 110px; height: 110px; object-fit: cover; border-radius: 6px; }
        .tab-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background-color: #e0e0e0; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background-color: #2980b9; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .btn { background-color: #2980b9; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        /* Baaki styling same hai */
    </style>
</head>
<body>

<header>
    <h1>ग्रामकार्ट इलेक्ट्रिकल्स</h1>
    <p>बिजली का सामान अब ऑनलाइन ऑर्डर करें</p>
</header>

<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">💡 1. LED बल्ब और लाइट</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">🔌 2. स्विच और सॉकेट</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">⚡ 3. बिजली के तार</button>
        <button class="tab-btn" onclick="openTab(event, 'tab4')">🌬️ 4. पंखे और कूलर</button>
        <button class="tab-btn" onclick="openTab(event, 'tab5')">🛠️ 5. अन्य इलेक्ट्रिक सामान</button>
    </div>

    <div id="tab1" class="tab-content active"><h2>LED बल्ब और लाइट</h2><div class="product-grid" id="grid1"></div></div>
    <div id="tab2" class="tab-content"><h2>स्विच और सॉकेट</h2><div class="product-grid" id="grid2"></div></div>
    <div id="tab3" class="tab-content"><h2>बिजली के तार</h2><div class="product-grid" id="grid3"></div></div>
    <div id="tab4" class="tab-content"><h2>पंखे और कूलर</h2><div class="product-grid" id="grid4"></div></div>
    <div id="tab5" class="tab-content"><h2>अन्य इलेक्ट्रिक सामान</h2><div class="product-grid" id="grid5"></div></div>
    
    <button class="btn" onclick="sendToWhatsApp()">व्हाट्सएप पर ऑर्डर भेजें 📲</button>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDa0V6_CekDnbG_hUelY7R6zjYXJUUAu-omp3Cw88Nv2wgdZS2zZuMYMXs_tmqxGtr_g/exec";

    // Data load logic
    let data1 = JSON.parse(localStorage.getItem('gc_electric_data1')) || [];
    let data2 = JSON.parse(localStorage.getItem('gc_electric_data2')) || [];
    let data3 = JSON.parse(localStorage.getItem('gc_electric_data3')) || [];
    let data4 = JSON.parse(localStorage.getItem('gc_electric_data4')) || [];
    let data5 = JSON.parse(localStorage.getItem('gc_electric_data5')) || [];

    window.onload = function() { fetchDataFromGoogleSheet(); };

    function fetchDataFromGoogleSheet() {
        fetch(APPS_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                if(data && data.success) {
                    if(data.sheetData1) { data1 = data.sheetData1; localStorage.setItem('gc_electric_data1', JSON.stringify(data1)); }
                    if(data.sheetData2) { data2 = data.sheetData2; localStorage.setItem('gc_electric_data2', JSON.stringify(data2)); }
                    if(data.sheetData3) { data3 = data.sheetData3; localStorage.setItem('gc_electric_data3', JSON.stringify(data3)); }
                    if(data.sheetData4) { data4 = data.sheetData4; localStorage.setItem('gc_electric_data4', JSON.stringify(data4)); }
                    if(data.sheetData5) { data5 = data.sheetData5; localStorage.setItem('gc_electric_data5', JSON.stringify(data5)); }
                    renderProducts();
                }
            })
            .catch(err => console.log("Sync error, using local data"));
    }

    function renderProducts() {
        renderGrid('grid1', data1, 'c1');
        renderGrid('grid2', data2, 'c2');
        renderGrid('grid3', data3, 'c3');
        renderGrid('grid4', data4, 'c4');
        renderGrid('grid5', data5, 'c5');
    }

    function renderGrid(cid, list, pre) {
        let h = "";
        list.forEach((it, i) => {
            h += `<div class="product-card">
                <img src="${it.img}" onerror="this.src='https://via.placeholder.com/110?text=Electric'">
                <div class="product-info">
                    <h3>${it.name}</h3>
                    <p>₹${it.price} / ${it.unit}</p>
                    <input type="number" id="${pre}_${i}" class="qty" value="0" min="0" data-price="${it.price}" data-name="${it.name}" data-unit="${it.unit}">
                </div>
            </div>`;
        });
        document.getElementById(cid).innerHTML = h;
    }

    function openTab(e, name) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function sendToWhatsApp() {
        // Logic vahi hai jo stationery wale mein thi
        alert("ऑर्डर प्रोसेस हो रहा है...");
    }
</script>
</body>
</html>
